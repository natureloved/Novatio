// Canton Multi-Participant Institutional Cluster Configuration
// Production reference architecture for Novatio:
// - 4 Independent Participant Nodes (Buyer, Supplier, Factorer, Auditor)
// - Dedicated Synchronizer Domain with PostgreSQL persistent storage
// - Sub-transaction privacy enforced at synchronizer sequencing layer

canton {
  // Synchronizer Domain (formerly Canton Domain)
  domains {
    trade_finance_synchronizer {
      storage {
        type = postgres
        config {
          dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
          serverName = ${?PG_HOST}
          serverName = "127.0.0.1"
          portNumber = 5432
          databaseName = "novatio_synchronizer"
          user = ${?PG_USER}
          user = "canton"
          password = ${?PG_PASSWORD}
          password = "canton_secure_secret"
        }
      }
      public-api {
        address = "0.0.0.0"
        port = 6860
      }
      admin-api {
        address = "127.0.0.1"
        port = 6861
      }
    }
  }

  // Independent Institutional Participant Nodes
  participants {
    // 1. Enterprise Debtor Node (Buyer / Tier-1 OEM)
    buyer_participant {
      storage {
        type = postgres
        config {
          dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
          serverName = "127.0.0.1"
          portNumber = 5432
          databaseName = "novatio_buyer"
          user = "canton"
          password = "canton_secure_secret"
        }
      }
      ledger-api {
        address = "0.0.0.0"
        port = 6865
        auth-services = [{
          type = "jwt-jwks"
          url = "http://127.0.0.1:8080/auth/realms/novatio/protocol/openid-connect/certs"
        }]
      }
      admin-api {
        address = "127.0.0.1"
        port = 7576
      }
    }

    // 2. Commercial Creditor Node (Supplier / Tier-2 Manufacturer)
    supplier_participant {
      storage {
        type = postgres
        config {
          dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
          serverName = "127.0.0.1"
          portNumber = 5432
          databaseName = "novatio_supplier"
          user = "canton"
          password = "canton_secure_secret"
        }
      }
      ledger-api {
        address = "0.0.0.0"
        port = 6875
        auth-services = [{
          type = "jwt-jwks"
          url = "http://127.0.0.1:8080/auth/realms/novatio/protocol/openid-connect/certs"
        }]
      }
      admin-api {
        address = "127.0.0.1"
        port = 7586
      }
    }

    // 3. Liquidity Desk Node (Factorer / Institutional Private Credit Desk)
    factorer_participant {
      storage {
        type = postgres
        config {
          dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
          serverName = "127.0.0.1"
          portNumber = 5432
          databaseName = "novatio_factorer"
          user = "canton"
          password = "canton_secure_secret"
        }
      }
      ledger-api {
        address = "0.0.0.0"
        port = 6885
        auth-services = [{
          type = "jwt-jwks"
          url = "http://127.0.0.1:8080/auth/realms/novatio/protocol/openid-connect/certs"
        }]
      }
      admin-api {
        address = "127.0.0.1"
        port = 7596
      }
    }

    // 4. Regulatory Observer Node (Auditor / Central Bank / Compliance Desk)
    auditor_participant {
      storage {
        type = postgres
        config {
          dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
          serverName = "127.0.0.1"
          portNumber = 5432
          databaseName = "novatio_auditor"
          user = "canton"
          password = "canton_secure_secret"
        }
      }
      ledger-api {
        address = "0.0.0.0"
        port = 6895
        auth-services = [{
          type = "jwt-jwks"
          url = "http://127.0.0.1:8080/auth/realms/novatio/protocol/openid-connect/certs"
        }]
      }
      admin-api {
        address = "127.0.0.1"
        port = 7606
      }
    }
  }

  // Feature flags: Enable Daml 2.10 / Canton 3.x sub-transaction validation
  features {
    enable-preview-features = true
    enable-testing-commands = false
  }
}
