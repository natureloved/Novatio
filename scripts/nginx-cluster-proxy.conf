events {
    worker_connections 1024;
}

http {
    # CORS headers for institutional Canton browser clients
    map $request_method $cors_method {
        OPTIONS 1;
        default 0;
    }

    server {
        listen 7575;
        server_name buyer-proxy;

        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept' always;

            proxy_pass http://canton-cluster:6865;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /readyz {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }

    server {
        listen 7576;
        server_name supplier-proxy;

        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept' always;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://canton-cluster:6875;
        }
    }

    server {
        listen 7577;
        server_name factorer-proxy;

        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept' always;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://canton-cluster:6885;
        }
    }

    server {
        listen 7578;
        server_name auditor-proxy;

        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept' always;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://canton-cluster:6895;
        }
    }
}
