<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="Novatio: confidential RWA factoring with atomic delivery-versus-payment on Canton Network">
  <!--
    BAND PLAN (1200x630). Every decorative path belongs to exactly one band, and
    text bands are kept clear of the curve band by a real gap:

      y  88..184   logo lockup: mark square + wordmark + descriptor
      y 244..330   headline line 1  "One invoice."
      y 331..416   headline line 2  "One writer." (accent word, brand gold)
      y 424..447   tagline
      y 447..481   CLEAR BAND (>=10px separation, no paths)
      y 481..499   badge pills row
      y 499..618   CURVE BAND: decorative arcs live here and ONLY here
      y 618..620   bottom accent rule

    Palette from frontend/src/index.css, hex for hex:
      ink #0B1F3A, ink-soft #2B3A55, ink-mute #6B7489, paper #F6F3EC,
      paper-2 #EFEAE0, line #D9D2C2, gold #A8853A, gold-soft #C9A75C,
      accent #1E4D3A, red #8B2E2E

    The mark is the same single-writer geometry as frontend/src/brand/NovatioMark.tsx
    (three lines to one gate to one outgoing arrow) so the card and the product agree.
  -->
  <defs>
    <linearGradient id="nv-banner-value" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A75C"/>
      <stop offset="1" stop-color="#A8853A"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="630" fill="#F6F3EC"/>

  <!-- ink field behind the head, so the wordmark and headline sit on one panel -->
  <rect x="0" y="0" width="1200" height="232" fill="#0B1F3A"/>

  <!-- the three invoice lines, faint, bleeding off the left edge: the set of documents -->
  <g stroke="#F6F3EC" stroke-width="1.5" opacity="0.10">
    <path d="M0 96 H420"/>
    <path d="M0 128 H300"/>
    <path d="M0 160 H470"/>
  </g>

  <!-- LOGO LOCKUP: y 88..184 -->
  <!-- mark, scaled 1.4: the 64-unit geometry at 90px -->
  <g transform="translate(88,88)">
    <path d="M9 18 H37" fill="none" stroke="#F6F3EC" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M9 32 H41" fill="none" stroke="#F6F3EC" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M9 46 H37" fill="none" stroke="#F6F3EC" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M46 14 V50" fill="none" stroke="#C9A75C" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M51 32 H59" fill="none" stroke="url(#nv-banner-value)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M54 27 L59 32 L54 37" fill="none" stroke="#A8853A" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark, y 108..192: Fraunces is the site's display serif -->
  <text x="202" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="66"
        font-weight="600" letter-spacing="-1.6" fill="#F6F3EC">Novatio</text>
  <!-- descriptor: monospace, the site's technical register -->
  <text x="204" y="196" font-family="'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="19" letter-spacing="4.6" fill="#C9A75C">CANTON NETWORK</text>

  <!-- HEADLINE line 1, y 244..330 -->
  <text x="88" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="82"
        font-weight="600" letter-spacing="-2.2" fill="#0B1F3A">One invoice.</text>
  <!-- HEADLINE line 2, y 331..416: the invariant, in brand gold -->
  <text x="88" y="404" font-family="Georgia, 'Times New Roman', serif" font-size="82"
        font-weight="600" letter-spacing="-2.2" fill="#A8853A">One writer.</text>

  <!-- tagline, y 424..447 -->
  <text x="88" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="26"
        fill="#2B3A55">Receivables that cannot be pledged twice.</text>

  <!-- badge pills row, y 481..499 -->
  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" letter-spacing="0.9">
    <rect x="88" y="473" width="212" height="40" rx="20" fill="none" stroke="#D9D2C2" stroke-width="1.5"/>
    <text x="108" y="499" fill="#2B3A55">ATOMIC DVP</text>
    <rect x="316" y="473" width="252" height="40" rx="20" fill="none" stroke="#D9D2C2" stroke-width="1.5"/>
    <text x="336" y="499" fill="#2B3A55">SUB-TX PRIVACY</text>
    <rect x="584" y="473" width="212" height="40" rx="20" fill="none" stroke="#D9D2C2" stroke-width="1.5"/>
    <text x="604" y="499" fill="#2B3A55">DAML</text>
  </g>

  <!-- CURVE BAND, y 499..618. Three arcs at decreasing amplitude, echoing the
       three-to-one mark, all below every text element. The long arc sweeps up
       into the empty lower-right so the right side is not dead space, and every
       arc terminates ON the 618 rule rather than being clipped by the edge. -->
  <g fill="none" stroke-width="2" opacity="0.5">
    <path d="M0 618 C 240 499, 520 499, 780 618" stroke="#A8853A"/>
    <path d="M180 618 C 380 545, 600 520, 900 560" stroke="#1E4D3A"/>
    <path d="M430 618 C 580 578, 760 570, 980 578" stroke="#C9A75C"/>
    <path d="M880 560 C 960 500, 1020 468, 1090 470" stroke="#C9A75C"/>
  </g>

  <!-- bottom accent rule, y 618..620 -->
  <rect x="0" y="618" width="1200" height="2" fill="#A8853A"/>
</svg>
